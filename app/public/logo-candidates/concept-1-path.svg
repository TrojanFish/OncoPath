<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Left Lung Ribbon Gradient (Healing Teal) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Right Lung Ribbon Gradient (Trust Blue) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Center Nav Path Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad1)" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="256" cy="270" r="100" fill="#2dd4bf" opacity="0.15" filter="blur(30px)" />

  <!-- Central Emblem: Stylized Modern Lung & Guiding Möbius Path -->
  <g transform="translate(0, 0)">
    
    <!-- Central Trachea / Guiding Light Beam -->
    <path d="M 256 100 L 256 220" stroke="url(#pathGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="96" r="8" fill="#38bdf8" filter="url(#coreGlow)" />

    <!-- Left Lung Lobe (Smooth Elegant Ribbon Flow) -->
    <path d="M 248 210 
             C 210 160, 120 180, 110 270 
             C 102 340, 160 400, 225 390 
             C 255 385, 252 320, 220 315 
             C 170 305, 150 250, 185 220 
             C 210 200, 240 215, 248 235 Z" 
          fill="url(#tealGrad)" opacity="0.95" />

    <!-- Left Lung Inner Airway Accent Line -->
    <path d="M 235 240 C 180 250, 150 310, 200 350" 
          fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <!-- Right Lung Lobe (Dynamic Navigation Upward Curve) -->
    <path d="M 264 210 
             C 302 160, 392 180, 402 270 
             C 410 340, 352 400, 287 390 
             C 257 385, 260 320, 292 315 
             C 342 305, 362 250, 327 220 
             C 302 200, 272 215, 264 235 Z" 
          fill="url(#blueGrad)" opacity="0.95" />

    <!-- Right Lung Inner Airway Accent Line -->
    <path d="M 277 240 C 332 250, 362 310, 312 350" 
          fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <!-- Central Guiding Crosshair / Evidence Beacon Star -->
    <g transform="translate(256, 265)" filter="url(#coreGlow)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
      <circle cx="0" cy="0" r="8" fill="#0284c7" />
      <!-- Star Spoke Flares -->
      <path d="M 0 -22 L 0 22 M -22 0 L 22 0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Upward Ascending Horizon Nodes (Longitudinal Surveillance Path) -->
    <circle cx="210" cy="140" r="4" fill="#0d9488" opacity="0.6" />
    <circle cx="302" cy="140" r="4" fill="#0284c7" opacity="0.6" />
    <circle cx="256" cy="420" r="5" fill="#0d9488" opacity="0.4" />
  </g>
</svg>