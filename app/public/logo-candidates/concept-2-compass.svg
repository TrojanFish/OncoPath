<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgDark2)" stroke="#1e293b" stroke-width="4" />

  <!-- Radar / Compass Outer Navigation Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle Compass Axes -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
  <line x1="90" y1="256" x2="422" y2="256" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Dual Lung Silhouette in Glowing Fiber Optic Nodes -->
  <g filter="url(#darkGlow)">
    <!-- Left Lobe Nodes & Neural Network -->
    <path d="M 245 180 Q 140 180 135 280 T 235 380 Q 250 320 220 280 Z" 
          fill="url(#cyanGrad2)" fill-opacity="0.25" stroke="#2dd4bf" stroke-width="4" />
    
    <!-- Right Lobe Nodes -->
    <path d="M 267 180 Q 372 180 377 280 T 277 380 Q 262 320 292 280 Z" 
          fill="url(#cyanGrad2)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="4" />

    <!-- Branching Bronchial Vectors -->
    <path d="M 256 140 L 256 220 M 256 220 L 200 270 M 256 220 L 312 270 M 200 270 L 170 320 M 312 270 L 342 320" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Evidence Star Node -->
    <circle cx="256" cy="220" r="9" fill="#38bdf8" />
    <circle cx="200" cy="270" r="7" fill="#2dd4bf" />
    <circle cx="312" cy="270" r="7" fill="#38bdf8" />
    <circle cx="170" cy="320" r="6" fill="#2dd4bf" />
    <circle cx="342" cy="320" r="6" fill="#38bdf8" />
    <circle cx="256" cy="140" r="6" fill="#f59e0b" />
  </g>
</svg>