<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="wingLeft3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wingRight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Rounded Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#ffffff" stroke="#f1f5f9" stroke-width="6" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#f0fdfa" />

  <!-- Shield Base (Surveillance & Protection) -->
  <path d="M 256 110 L 370 160 C 370 290 290 380 256 410 C 222 380 142 290 142 160 Z" 
        fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />

  <!-- Geometric Abstract Winged Lung Lobes Inside Shield -->
  <!-- Left Lobe Feather Wings -->
  <path d="M 244 150 C 180 170 170 250 200 310 C 220 340 244 355 244 355 C 244 355 228 300 232 250 C 235 200 244 150 244 150 Z" 
        fill="url(#wingLeft3)" />

  <!-- Right Lobe Feather Wings -->
  <path d="M 268 150 C 332 170 342 250 312 310 C 292 340 268 355 268 355 C 268 355 284 300 280 250 C 277 200 268 150 268 150 Z" 
        fill="url(#wingRight3)" />

  <!-- Central Pure Pathway (OncoPath "O" & "P" Monogram Convergence) -->
  <circle cx="256" cy="220" r="22" fill="#ffffff" stroke="url(#shieldGrad3)" stroke-width="8" />
  <path d="M 256 242 L 256 340" stroke="url(#shieldGrad3)" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="220" r="8" fill="#0284c7" />
</svg>