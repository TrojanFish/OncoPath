<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPurePath" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Three Pure Minimalist Vector Elements forming [Lungs + Direction Arrow] -->
  <g transform="translate(0, 0)">
    <!-- Left Lung Minimal Contour -->
    <path d="M 230 130 C 140 130, 110 200, 110 280 C 110 360, 160 400, 230 400" 
          fill="none" 
          stroke="#0d9488" 
          stroke-width="48" 
          stroke-linecap="round" />

    <!-- Right Lung / Upward Path (Ascending Chevron Breath) -->
    <path d="M 282 400 C 352 400, 402 360, 402 280 C 402 200, 372 130, 282 130" 
          fill="none" 
          stroke="#0284c7" 
          stroke-width="48" 
          stroke-linecap="round" />

    <!-- Central Minimal Compass Diamond / Guiding Chevron -->
    <path d="M 256 180 L 285 240 L 256 300 L 227 240 Z" 
          fill="url(#gradPurePath)" />
  </g>
</svg>