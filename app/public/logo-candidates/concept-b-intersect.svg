<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBluePure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradTealPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Pure Geometric Intersecting Droplet / Dual Lung Leaves -->
  <g transform="translate(0, 0)">
    <!-- Left Leaf (Teal) -->
    <path d="M 256 120 
             C 180 120, 130 180, 130 260 
             C 130 350, 200 400, 256 400 
             C 256 400, 256 220, 256 120 Z" 
          fill="url(#gradTealPure)" />

    <!-- Right Leaf (Blue - Shifted slightly up & outward to form dynamic lung symmetry) -->
    <path d="M 256 100 
             C 332 100, 382 160, 382 240 
             C 382 330, 312 380, 256 380 
             C 256 380, 256 200, 256 100 Z" 
          fill="url(#gradBluePure)" 
          style="mix-blend-mode: multiply;" 
          opacity="0.88" />

    <!-- Precision Central Slit / Airway Negative Space -->
    <line x1="256" y1="90" x2="256" y2="410" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="240" r="14" fill="#ffffff" />
  </g>
</svg>