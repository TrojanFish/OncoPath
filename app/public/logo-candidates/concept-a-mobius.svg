<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradMobius" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Transparent / Pure Minimal Background -->
  <!-- Bold, unified, unbroken continuous curve forming Lung Lobe & Path -->
  <g transform="translate(0, 0)">
    <!-- Main Mobius Breath Path -->
    <path d="M 256 90 
             C 330 90, 390 150, 390 230
             C 390 320, 310 400, 240 422
             C 210 430, 185 410, 185 380
             L 185 180
             C 185 130, 215 90, 256 90 Z" 
          fill="none" 
          stroke="url(#gradMobius)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left Complementary Minimal Inner Breath Arc -->
    <path d="M 185 240 
             C 140 255, 120 295, 120 335
             C 120 385, 160 415, 205 415" 
          fill="none" 
          stroke="#0d9488" 
          stroke-width="44" 
          stroke-linecap="round" />

    <!-- Pure Focal Center Point (Evidence Beacon) -->
    <circle cx="285" cy="235" r="28" fill="#0284c7" />
  </g>
</svg>