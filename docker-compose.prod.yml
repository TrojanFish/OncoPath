services:
  # 1. Production PostgreSQL Database with Automated Healthcheck
  db:
    image: postgres:16-alpine
    container_name: oncopath-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oncopath_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-OncoPathSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-oncopath_production}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncopath_admin} -d ${POSTGRES_DB:-oncopath_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - oncopath_net

  # 2. Next.js 16 Web Application Service
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: oncopath-prod-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-oncopath_admin}:${POSTGRES_PASSWORD:-OncoPathSecure2026!}@db:5432/${POSTGRES_DB:-oncopath_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-OncoPath2026!}
      - ADMIN_SECRET=${ADMIN_SECRET:-oncopath_evidence_admin_secret_key_2026}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - oncopath_net

  # 3. High-Performance Nginx Reverse Proxy (SSE Streaming + Rate Limiting)
  nginx:
    image: nginx:alpine
    container_name: oncopath-prod-nginx
    ports:
      - "${PROD_HTTP_PORT:-38000}:80"
      - "${PROD_HTTPS_PORT:-38443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always
    networks:
      - oncopath_net

volumes:
  pgdata_prod:
    driver: local

networks:
  oncopath_net:
    driver: bridge
