user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Real IP Resolution (Cloudflare CF-Connecting-IP support + Direct Access fallback)
    map $http_cf_connecting_ip $client_real_ip {
        "" $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Rate Limiting Zones (Keyed by real client IP to prevent Cloudflare edge IP collision)
    limit_req_zone $client_real_ip zone=ai_heavy:10m rate=15r/m;
    limit_req_zone $client_real_ip zone=api_general:10m rate=60r/s;

    upstream nextjs_upstream {
        server app:3000 max_fails=5 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Proxy Buffering Configuration for Next.js Headers & RSC Payloads
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # 1. Critical SSE Streaming Route Configuration (/api/generate-report)
        # Prevents Nginx from buffering LLM streaming text output
        location /api/generate-report {
            limit_req zone=ai_heavy burst=10 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time typewriter SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;

            # Extended read timeout for large medical report generation (5 minutes)
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
        }

        # 2. OCR / Multimodal Parser Route (/api/parse-report)
        location /api/parse-report {
            limit_req zone=ai_heavy burst=10 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;
        }

        # 3. Next.js Static Asset Aggressive Caching (1 Year immutable)
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 4. Next.js Public Assets (Favicons, Logos, Manifest, Images)
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # 5. Default Route Pass-Through (Smooth Navigation without 503 Choking)
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }

    # Optional HTTPS Server Block (Uncomment when fullchain.pem and privkey.pem are placed in nginx/certs/)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    # 
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    # 
    #     # Modern Security Headers
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options SAMEORIGIN always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 
    #     proxy_buffer_size 128k;
    #     proxy_buffers 4 256k;
    #     proxy_busy_buffers_size 256k;
    # 
    #     location /api/generate-report {
    #         limit_req zone=ai_heavy burst=10 nodelay;
    #         proxy_pass http://nextjs_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
